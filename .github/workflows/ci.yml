name: Next.js CI Sandbox 🤖

on:
  push:
    branches:
      - main
      - uat
      - dev
  pull_request:
    branches:
      - main
      - uat
      - dev

jobs:
  test-and-verify:
    runs-on: ubuntu-latest

    steps:
      # 1. ดึงโค้ดลงเครื่องหุ่นยนต์
      - name: Checkout Code 📑
        uses: actions/checkout@v4

      # 2. ตั้งค่า Node.js 20
      - name: Setup Node.js 20 🟢
        uses: actions/setup-node@v4
        with:
          node-version: 20

      # 3. ตั้งค่า pnpm เวอร์ชัน 9
      - name: Setup pnpm 📦
        uses: pnpm/action-setup@v3
        with:
          version: 9

      # 4. ติดตั้ง Node Modules (รันตรงจุดที่เจอ package.json ได้เลย)
      - name: Install Dependencies 🛠️
        run: pnpm install

      # 5. วินาทีตัดเชือก รันเทส Vitest อัตโนมัติ
      - name: Run Automated Tests 🧪
        run: pnpm test